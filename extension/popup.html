<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { width: 260px; margin: 0; font: 14px system-ui, sans-serif; background: #0f172a; color: #e2e8f0; }
      header { padding: 12px 14px; border-bottom: 1px solid #1e293b; font-weight: 700; }
      .body { padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
      button { border: 0; border-radius: 8px; padding: 9px 12px; font: 600 13px system-ui; cursor: pointer; }
      .primary { background: #0ea5e9; color: #0f172a; }
      .ghost { background: #1e293b; color: #e2e8f0; }
      .row { display: flex; gap: 6px; }
      .row input { flex: 1; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #e2e8f0; padding: 7px 9px; font: 12px system-ui; }
      #status { font-size: 12px; color: #94a3b8; min-height: 16px; }
      a { color: #38bdf8; }
    </style>
  </head>
  <body>
    <header>JobMate Companion</header>
    <div class="body">
      <button id="capture" class="primary">Capture this job</button>
      <button id="autofill" class="ghost">Autofill this page</button>
      <button id="map" class="ghost">Map fields…</button>
      <div class="row">
        <input id="tracker" placeholder="http://localhost:5173" />
        <button id="open" class="ghost">Open</button>
      </div>
      <div id="status"></div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
